name: Lint & Security Scan

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Unified Linting
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Java Compile (Lint)
        run: |
          cd cloud-boot-app
          mvn compile -Dnet.bytebuddy.experimental=true

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.7.5

      - name: Terraform Fmt & Validate
        run: |
          cd cloud-boot-app
          terraform fmt -recursive -check terraform/
          find terraform/ -name "*.tf" -exec dirname {} \; | sort -u | xargs -I {} sh -c "cd {} && terraform init -backend=false && terraform validate"

      - name: Set up TFLint
        uses: terraform-linters/setup-tflint@v4
        with:
          tflint_version: v0.50.3

      - name: Run TFLint
        run: |
          cd cloud-boot-app
          tflint --recursive --config ../.tflint.hcl terraform/

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.14.2

      - name: Helm Lint
        run: |
          cd cloud-boot-app
          helm lint helm/cloud-boot-app

      - name: Run Checkov (Security Scan)
        uses: bridgecrewio/checkov-action@master
        with:
          directory: cloud-boot-app
          quiet: true
          framework: terraform,helm
          skip_check: CKV_AWS_144,CKV_AWS_111

      - name: OPA Policy Check (Conftest)
        uses: open-policy-agent/conftest-action@master
        with:
          files: cloud-boot-app/gatekeeper/templates/

      - name: Docker Lint (Hadolint)
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: cloud-boot-app/Dockerfile
