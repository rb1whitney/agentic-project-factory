name: Factory Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    name: Factory Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Lint (Ruff)
        run: |
          pip install ruff
          ruff check . --exclude projects,mcp-servers/mcp-*

      - name: Shell Lint (ShellCheck)
        uses: ludeeus/shellcheck-action@master
        with:
          ignore_paths: projects mcp-servers/mcp-*

      - name: Markdown Lint
        uses: nosotrosa/github-action-markdown-cli@v3.3.0
        with:
          files: .
          config: .markdownlint.json
          ignore_path: .markdownlintignore
