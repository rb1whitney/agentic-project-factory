name: Factory Linting

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

permissions:
  contents: read
  pull-requests: write
  checks: write

jobs:
  lint:
    name: Factory Quality Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Python Lint (Ruff)
        run: |
          pip install ruff
          ruff check . --exclude projects,mcp-servers/mcp-*

      - name: Shell Lint (ShellCheck)
        uses: reviewdog/action-shellcheck@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-check
          path: "."
          exclude: "./projects/*"

      - name: Markdown Lint
        uses: DavidAnson/markdownlint-cli2-action@v19
        with:
          globs: |
            **/*.md
            !projects/**
            !mcp-servers/mcp-*/**
            !.ast_cache/**
            !node_modules/**
