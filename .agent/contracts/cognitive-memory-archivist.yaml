id: cognitive-memory-archivist
trigger: Ingest, consolidate, page, and query persistent SQLite session memory, episodic context, and
  relational knowledge graph triples
input_schema:
  required:
    memory_action: string
    query_topic: string
  optional:
    session_id: string
output_schema:
  recalled_insights: string
  memory_db_state: string
preconditions:
- SQLite memory store initialized via bin/memory_agent.py
postconditions:
- Session insights persisted and deduplicated without context bloat
resources:
- bin/memory_agent.py
side_effects:
  filesystem: updates local SQLite memory db
  network: none
source_parents:
- skill-always-on-memory
action_templates:
- '# Route: select runbook from the Reference & Script Routing Index in SKILL.md; read only the matched
  file'
- python3 bin/memory_agent.py {memory_action} --query "{query_topic}" 2>/dev/null | bin/rtk
bindings:
  skill-always-on-memory:
    skill_dir: .agent/skills/skill-always-on-memory
verifier_stats:
  coverage: 1.0
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 1.0
  tier: auto_promote
