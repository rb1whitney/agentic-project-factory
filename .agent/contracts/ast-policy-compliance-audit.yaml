id: ast-policy-compliance-audit
trigger: Execute 6-Pillar Well-Architected AST rules, compliance security checks, and behavioral evaluations
input_schema:
  required:
    target_dir: path
    pillar_scope: string
  optional:
    rule_pack: string
output_schema:
  findings_json: string
  compliance_status: string
  remediation_diff: string
preconditions:
- ast-grep binary installed
- Read-only static analysis mode
postconditions:
- Zero secret leak or policy violation unflagged
resources:
- .agent/skills/skill-code-map/scripts/well_architected_audit.py
- .agent/skills/skill-code-map/scripts/local_extract.py
side_effects:
  filesystem: none
  network: none
source_parents:
- skill-compliance-auditor
action_templates:
- /usr/bin/python3 .agent/skills/skill-code-map/scripts/well_architected_audit.py {target_dir} --pillar
  {pillar_scope} | bin/rtk
- /usr/bin/python3 .agent/skills/skill-code-map/scripts/local_extract.py {target_dir} | bin/rtk
bindings:
  skill-compliance-auditor:
    target_dir: <target_dir>
    pillar_scope: <pillar_scope>
verifier_stats:
  coverage: 0.48
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 0.844
  tier: auto_promote
