id: sre-telemetry-incident-response
trigger: SRE monitoring references and time series description analysis for logs, SLO burn, and anomaly
  detection
input_schema:
  required:
    monitoring_time: string
  optional:
    severity_filter: string
output_schema:
  sre_monitoring_summary: string
  references_playbook: string
preconditions:
- Read-only telemetry query scope
- Time window bounded to prevent token overflow
postconditions:
- Root-cause signal correlated across logs, metrics, and traces
resources:
- .agent/skills/skill-sre-investigation/scripts/
- .agent/skills/skill-sre-investigation/references/
side_effects:
  filesystem: none
  network: read-only telemetry API
source_parents:
- skill-sre-investigation
action_templates:
- '# Route: select runbook from the Reference & Script Routing Index in SKILL.md; read only the matched
  file'
- gcloud logging read 'severity>=ERROR' --freshness={monitoring_time} --limit=25 --format=json | bin/rtk
- python3 .agent/skills/skill-sre-investigation/scripts/detect_zscore.py --help 2>/dev/null | bin/rtk
bindings:
  skill-sre-investigation:
    skill_dir: .agent/skills/skill-sre-investigation
verifier_stats:
  coverage: 1.0
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 1.0
  tier: auto_promote
