id: k8s-workload-triage
trigger: Diagnose Kubernetes pod status, container logs, events, local k3s cluster state, and service
  mesh routing
input_schema:
  required:
    namespace: string
    pod_name: string
  optional:
    container_name: string
    kubeconfig: path
output_schema:
  root_cause_category: string
  evidence_log_span: string
  remediation_cmd: string
preconditions:
- kubectl context verified
- Reference runbooks indexed in {SKILL_DIR}/references/
postconditions:
- Failure isolated to image, crashloop, probe, resource limit, or network before mutation
resources:
- '{SKILL_DIR}/references/istio-expert.md'
- '{SKILL_DIR}/references/k9s-expert.md'
- '{SKILL_DIR}/references/service-management.md'
side_effects:
  filesystem: none
  network: read-only K8s API GET/LIST
source_parents:
- skill-kubernetes
action_templates:
- ls {SKILL_DIR}/references/ {SKILL_DIR}/scripts/ 2>/dev/null | bin/rtk
- kubectl get pods -n {namespace} | bin/rtk
- kubectl logs {pod_name} -n {namespace} --tail=100 | bin/rtk
- kubectl describe pod {pod_name} -n {namespace} | bin/rtk
- bash .agent/skills/skill-kubernetes/scripts/verify-cluster.sh 2>/dev/null | bin/rtk
bindings:
  skill-kubernetes:
    namespace: <namespace>
    pod_name: <pod_name>
verifier_stats:
  coverage: 0.5667
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 0.87
  tier: auto_promote
