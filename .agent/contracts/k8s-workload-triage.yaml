id: k8s-workload-triage
trigger: Diagnose Kubernetes pod status, container logs, events, local k3s cluster state, and service
  mesh routing
input_schema:
  required:
    namespace: string
    pod_name: string
  optional:
    container_name: string
    kubeconfig: path
output_schema:
  root_cause_category: string
  evidence_log_span: string
  remediation_cmd: string
preconditions:
- kubectl context verified
- Reference runbooks indexed in .agent/skills/skill-kubernetes/references/
postconditions:
- Failure isolated to image, crashloop, probe, resource limit, or network before mutation
resources:
- .agent/skills/skill-kubernetes/references/istio-specialist.md
- .agent/skills/skill-kubernetes/references/k9s-specialist.md
side_effects:
  filesystem: none
  network: read-only K8s API GET/LIST
source_parents:
- skill-kubernetes
action_templates:
- '# Route: select runbook from the Reference & Script Routing Index in SKILL.md; read only the matched
  file'
- kubectl get pods -n {namespace} | bin/rtk
- kubectl logs {pod_name} -n {namespace} --tail=100 | bin/rtk
- kubectl describe pod {pod_name} -n {namespace} | bin/rtk
- bash .agent/skills/skill-kubernetes/scripts/verify-cluster.sh 2>/dev/null | bin/rtk
bindings:
  skill-kubernetes:
    skill_dir: .agent/skills/skill-kubernetes
verifier_stats:
  coverage: 1.0
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 1.0
  tier: auto_promote
