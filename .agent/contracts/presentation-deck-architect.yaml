id: presentation-deck-architect
trigger: Narrative-first presentation architecture, storyboard validation, and editable PPTX slide generation
  from technical docs
input_schema:
  required:
    storyboard_path: path
    narrative_brief_path: path
  optional:
    output_pptx: path
output_schema:
  storyboard_status: string
  deck_artifact_path: path
preconditions:
- Narrative brief and evidence ledger verified before storyboard
- Storyboard approved by USER before rendering PPTX
postconditions:
- Storyboard and narrative brief pass validate_storyboard.py with zero errors
resources:
- '{SKILL_DIR}/references/narrative-craft.md'
- '{SKILL_DIR}/references/sap-docs-bridge.md'
- '{SKILL_DIR}/scripts/validate_storyboard.py'
side_effects:
  filesystem: writes storyboard YAML and PPTX artifacts
  network: none
source_parents:
- skill-presentation-architect
action_templates:
- ls .agent/skills/skill-presentation-architect/references/ .agent/skills/skill-presentation-architect/scripts/
  2>/dev/null | bin/rtk
- python3 .agent/skills/skill-presentation-architect/scripts/validate_storyboard.py --brief {narrative_brief_path}
  | bin/rtk
- python3 .agent/skills/skill-presentation-architect/scripts/validate_storyboard.py {storyboard_path}
  | bin/rtk
bindings:
  skill-presentation-architect:
    storyboard_path: <storyboard_path>
    narrative_brief_path: <narrative_brief_path>
verifier_stats:
  coverage: 1.0
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 1.0
  tier: auto_promote
