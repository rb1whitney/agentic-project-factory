id: aws-cloud-architecture-audit
trigger: AWS capability reference guide and skill_dir references management for foundation, serverless,
  sagemaker, migration, and finops
input_schema:
  required:
    skill_dir: path
    aws_service: string
  optional:
    aws_region: string
output_schema:
  reference_file: string
  aws_management_plan: string
preconditions:
- AWS credentials sourced via environment or gopass
- Read-only describe/list calls first
postconditions:
- Blast radius and cost delta documented before state mutation
resources:
- '{SKILL_DIR}/references/'
side_effects:
  filesystem: none
  network: read-only AWS API describe/list
source_parents:
- skill-aws
action_templates:
- ls {skill_dir}/references/ 2>/dev/null | bin/rtk
- aws sts get-caller-identity | bin/rtk
- aws {aws_service} help 2>/dev/null | head -n 30 | bin/rtk
bindings:
  skill-aws:
    skill_dir: <skill_dir>
    aws_service: <aws_service>
verifier_stats:
  coverage: 1.0
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 1.0
  tier: auto_promote
