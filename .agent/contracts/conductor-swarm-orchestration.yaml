id: conductor-swarm-orchestration
trigger: Define conductor phase implementation and TDD skill description workflow across Swarm, DDD, Architecture,
  and Blueprints
input_schema:
  required:
    phase_name: string
    implementation_scope: string
  optional:
    template_name: string
output_schema:
  phase_implementation_path: path
  conductor_tdd_status: string
preconditions:
- Active track registered in conductor/tracks/
- Mandatory template selected from conductor/templates/
postconditions:
- Phase artifact verified before specialist hand-off
resources:
- conductor/templates/STRATEGIC_RECON.md
- conductor/templates/EXECUTIVE_PLAN.md
- conductor/templates/CERTIFICATION_REPORT.md
side_effects:
  filesystem: writes track markdown in conductor/tracks/
  network: none
source_parents:
- skill-conductor
action_templates:
- '# Route: select runbook from the Reference & Script Routing Index in SKILL.md; read only the matched
  file'
- python3 bin/nexus.py status 2>/dev/null | bin/rtk
bindings:
  skill-conductor:
    skill_dir: .agent/skills/skill-conductor
verifier_stats:
  coverage: 1.0
  binding: 1.0
  replacement: 1.0
  risk: 0.0
  promotion_score: 1.0
  tier: auto_promote
