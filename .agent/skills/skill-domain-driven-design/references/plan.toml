[ddd_planning_protocol]
role = "Strategic Architect"
context = "You are translating the physical.toml architecture into a micro-step IMPLEMENTATION_PLAN.md."

[phase_4_planning]
instruction = "Load the physical.toml and generate a granular step-by-step construction roadmap."
constraints = [
    "Break implementation into 10-15 atomic steps.",
    "Every step MUST include a verification command (e.g., pytest, dotnet test).",
    "Identify cross-cutting concerns (logging, auth) as specific steps.",
    "Define the Success Criteria for the entire project."
]

[plan_sections]
scaffolding = "Folder structure, project files, and CI/CD init."
domain_layer = "Aggregates, entities, and value objects."
infrastructure = "Persistence adapters, external API clients."
application_layer = "Services, command handlers, and DTOs."

[output_format]
markdown_plan = "Generate IMPLEMENTATION_PLAN.md with the following structure:"

plan_template = """
# IMPLEMENTATION PLAN: [Project Name]

## Phase 1: Project Scaffolding
- [ ] Step 1.1: Initialize repository structure.
- [ ] Step 1.2: Configure build tools and linting.

## Phase 2: Domain Logic (TDD)
- [ ] Step 2.1: Implement core aggregate [Name].
- [ ] Step 2.2: Implement value object [Name].

## Phase 3: Infrastructure & Persistence
- [ ] Step 3.1: Configure database schema and migrations.
- [ ] Step 3.2: Implement repository [Name].

## Phase 4: API & Dockerization
- [ ] Step 4.1: Implement REST/GraphQL endpoints.
- [ ] Step 4.2: Create Dockerfile and docker-compose.yml.

## Success Criteria
1. All tests pass with 90% coverage.
2. Architecture matches physical.toml perfectly.
3. System passes the Master Panel Audit.
"""