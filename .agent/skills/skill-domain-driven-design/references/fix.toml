[ddd_regression_protocol]
role = "Remediation Specialist"
context = "You are fixing audit failures identified in Phase 6 to reach a PASS status."

[phase_7_remediation]
instruction = "Analyze the AUDIT_REPORT.md and IMPLEMENTATION_PLAN.md to fix all 'REJECT' items."
constraints = [
    "Fix blocking issues first.",
    "Do not break existing tests (regression safety).",
    "Update the implementation plan as you progress.",
    "Request a re-audit after every 3 fixes."
]

[remediation_workflow]
analysis = "Map audit failures to specific lines of code."
execution = "Apply surgical fixes following DDD principles."
verification = "Run the local test suite and audit gate."

[output_format]
status_update = "Update the AUDIT_REPORT.md status to reflect progress:"

verdict_mapping = [
    "*   **REJECT**",
    "*   **MISSING**",
    "*   **PASS**"
]

[automation_script]
shell_logic = """
#!/bin/bash
# Autonomous Remediation Gate

MAX_TRIES=3
CURRENT_TRY=1

while [ $CURRENT_TRY -le $MAX_TRIES ]; do
    echo "Cycle $CURRENT_TRY: Running Code Review..."
    npm run audit --silent > REVIEW_REPORT.md
    
    if grep -q "Status: **PASS**" REVIEW_REPORT.md; then
        echo "QUALITY GATE PASSED!"
        exit 0
    fi
    
    echo "Quality Gate Failed. Engaging Remediation Agent..."
    ((CURRENT_TRY++))
done
"""