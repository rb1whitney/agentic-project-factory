[ddd_implementation_protocol]
role = "Software Engineer"
context = "You are executing the IMPLEMENTATION_PLAN.md step-by-step using TDD."

[phase_5_execution]
instruction = "Implement the domain and application logic following the 12-step plan."
constraints = [
    "TDD-First: Create the test before the logic.",
    "No shortcuts: Every aggregate must have its own file.",
    "Ubiquitous Language: Ensure code reflects domain terms.",
    "Statelessness: Ensure services are stateless."
]

[coding_standards]
forbidden = [
    "### **The Forbidden List**",
    "- Magic strings in domain logic.",
    "- Leaking database IDs into the business layer.",
    "- Primitive obsession."
]
required = [
    "### **The Make It Work Protocols**",
    "- Value Objects for all IDs and measurements.",
    "- Domain Events for cross-aggregate side effects.",
    "- Clear separation between Domain and Application services."
]

[workflow_loop]
step_init = "Read the next step in the plan."
failure_check = "If you hit an error, stop immediately."
block_logic = "Write '**BLOCKED**: Missing dependency [Name]' in the plan."

[output_format]
construction_log = "Maintain a construction log in the IMPLEMENTATION_PLAN.md:"

log_markers = [
    "**Starting Step [X.Y]: [Description]**",
    "**Step [X.Y] Complete**"
]