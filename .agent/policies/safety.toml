# Gemini CLI Security Policy
# Goal: Allow read-only operations without confirmation, require confirmation for mutations.

# 1. Automatically allow all read-only built-in tools
[[rule]]
toolName = "*"
toolAnnotations = { readOnlyHint = true }
decision = "allow"
priority = 100

# 2. Allow common read-only/informational shell commands (no chaining/redirection)
[[rule]]
toolName = "run_shell_command"
commandRegex = "^(ls|cat|grep|find|head|tail|wc|du|df|stat|file|which|type|man|info|whoami|pwd|date|uptime|id|groups|env|set|alias|history|ps|top|free|lscpu|lsblk|uname|hostname|whereis|readlink|realpath)(\\s+[^;&|`\\$\\s][^;&|`\\$]*)?$"
decision = "allow"
priority = 110

# 3. Allow common read-only git commands
[[rule]]
toolName = "run_shell_command"
commandRegex = "^git (status|log|diff|branch|remote|show|tag --list|rev-parse|ls-files|ls-tree|describe|name-rev|cat-file|config --list|config -l|blame|shortlog|count-objects|verify-tag|verify-commit|hash-object|check-ignore|check-attr)(\\s+[^;&|`\\$\\s][^;&|`\\$]*)?$"
decision = "allow"
priority = 110

# 4. Allow common read-only cloud/cli commands (aws, gcloud, gh, kubectl, terraform, npm, pip, cargo)
[[rule]]
toolName = "run_shell_command"
commandRegex = "^(aws|gcloud|gh|kubectl|terraform|npm|pip|cargo) ([-a-zA-Z0-9_-]+ )*(list|describe|get|view|status|info|show|plan|logs|output|check|metadata|outdated|v|version|freeze|tree|verify-project|pkgid|test --no-run|providers|test|cluster-info|config view|api-versions|api-resources|auth can-i|explain|l|ls)(\\s+[^;&|`\\$\\s][^;&|`\\$]*)?$"
decision = "allow"
priority = 110

# 5. Network Governance: Restrict egress to approved domains
[[rule]]
name = "Network Governance"
toolName = "web_search"
allowedDomains = ["*.google.com", "*.github.com", "*.microsoft.com", "*.anthropic.com", "*.openai.com"]
decision = "allow"
priority = 120

# 6. Tool Egress: Require human-in-the-loop (HITL) for destructive commands
[[rule]]
name = "Tool Egress"
toolName = "run_shell_command"
commandRegex = ".*(rm -rf|git push --force|terraform destroy).*"
decision = "ask_user"
priority = 200

# 7. Default Policy
[[rule]]
toolName = "*"
decision = "ask_user"
priority = 10