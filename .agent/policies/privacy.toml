# DATA PRIVACY SHIELD: Blocking Credential Exfiltration

[[rules]]
name = "Deny Access to SSH Keys"
description = "Strictly prevent all agents from reading private SSH keys."
action = "deny"
toolName = "view_file"
filePath = "~/.ssh/*"

[[rules]]
name = "Deny Access to Cloud Credentials"
description = "Strictly prevent all agents from reading raw cloud credential files."
action = "deny"
toolName = "view_file"
filePath = "~/.aws/*"

[[rules]]
name = "Deny Access to Cloud Credentials (GCP)"
description = "Strictly prevent all agents from reading raw GCP credential files."
action = "deny"
toolName = "view_file"
filePath = "~/.config/gcloud/configurations/*"

[[rules]]
name = "Deny Access to Environment Files"
description = "Protect sensitive environment variables."
action = "deny"
toolName = "view_file"
filePath = "**/.env*"

[[rules]]
name = "Deny Access to Local Database Shards"
description = "Protect local data sovereignty."
action = "deny"
toolName = "view_file"
filePath = "**/data/*.db"

[[rules]]
name = "Allow Platform Provisioner to Check SSH"
subagent = "platform-provisioner"
description = "Allow the provisioner specifically to check for key existence (not content)."
action = "allow"
toolName = "run_command"
commandPrefix = "ls ~/.ssh/"

# Shell bypass guard: view_file denies above do not cover run_command (cat/head/tail are allowlisted).
[[rules]]
name = "Deny Shell Reads of Credential Paths"
description = "Block run_command access to SSH keys, cloud creds, agent OAuth tokens and .env files."
action = "deny"
decision = "deny"
priority = 300
toolName = "run_command"
commandRegex = '(\.ssh/|\.aws/|\.config/gcloud/|\.gemini/(oauth_creds|antigravity-cli/antigravity-oauth|config/config\.json)|/\.env(\.|\s|$)|\s\.env(\.|\s|$))'
